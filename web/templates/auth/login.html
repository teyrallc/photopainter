{% extends "_kiosk.html" %}
{% from "_icons.html" import icon %}
{% block title %}Vignette — Sign in{% endblock %}

{% block brand %}
<h1>Welcome back</h1>
<p>Sign in to your display</p>
{% endblock %}

{% block card %}
<form id="login-form">
    <div class="field">
        <label class="label" for="email">Admin email</label>
        <input type="email" class="input" id="email" required placeholder="you@example.com"
               autocomplete="username" autocapitalize="none" spellcheck="false">
    </div>

    <div class="field">
        <label class="label" for="password">Password</label>
        <div class="input-group">
            <input type="password" class="input" id="password" required placeholder="••••••••"
                   autocomplete="current-password">
            <button type="button" class="input-group__btn" id="toggle-pass"
                    aria-label="Show password" aria-pressed="false">
                <span id="pass-eye">{{ icon('eye') }}</span>
                <span id="pass-eye-off" class="hidden">{{ icon('eye-off') }}</span>
            </button>
        </div>
    </div>

    <div class="alert alert--danger mb-2 hidden" id="error-msg"></div>

    <button type="submit" class="btn btn--primary btn--block">
        {{ icon('arrow-right') }} Sign in
    </button>
</form>

<p class="center mt-2 mb-0">
    <a href="/auth/forgot-password" class="small">Forgot your password?</a>
</p>
{% endblock %}

{% block scripts %}
<script>
(function () {
    'use strict';

    var form  = document.getElementById('login-form');
    var error = document.getElementById('error-msg');

    document.getElementById('toggle-pass').addEventListener('click', function () {
        var input = document.getElementById('password');
        var shown = input.type === 'text';
        input.type = shown ? 'password' : 'text';
        this.setAttribute('aria-pressed', shown ? 'false' : 'true');
        document.getElementById('pass-eye').classList.toggle('hidden', !shown);
        document.getElementById('pass-eye-off').classList.toggle('hidden', shown);
    });

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = form.querySelector('button[type="submit"]');
        var restore = V.busy(btn, 'Signing in…');
        error.classList.add('hidden');

        fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            })
        })
        .then(function (r) { return r.json().catch(function () { return {}; }); })
        .then(function (data) {
            if (data.success) {
                window.location.href = '/';
                return;
            }
            restore();
            error.textContent = data.error || 'Sign in failed.';
            error.classList.remove('hidden');
        })
        .catch(function () {
            restore();
            error.textContent = 'Could not reach the display. Check your connection and try again.';
            error.classList.remove('hidden');
        });
    });
})();
</script>
{% endblock %}

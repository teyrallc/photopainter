<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vignette - Password Recovery</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { width: 100%; max-width: 420px; }
        .brand { text-align: center; margin-bottom: 24px; }
        .brand h1 { color: #f8fafc; font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
        .brand p { color: #94a3b8; font-size: 15px; margin-top: 4px; }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 32px 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; color: #cbd5e1; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
        .form-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 16px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.2s;
        }
        .form-group input:focus { border-color: #3b82f6; background: rgba(0,0,0,0.3); }
        .btn-primary {
            width: 100%;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:active { transform: scale(0.98); }
        .error { color: #ef4444; font-size: 14px; margin-top: 8px; text-align: center; display: none; }
        .info { color: #cbd5e1; font-size: 13px; text-align: center; margin-bottom: 20px; line-height: 1.5; }
        .links { margin-top: 20px; text-align: center; }
        .links a { color: #94a3b8; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">
            <h1>Account Recovery</h1>
            <p>Request Hardware Auth Token</p>
        </div>
        <div class="card">
            <div class="info">
                Enter your registered admin email. A 6-digit recovery code will be displayed on the physical Vignette E-Paper screen to verify your physical presence.
            </div>
            <form id="forgotForm">
                <div class="form-group">
                    <label>Admin Email</label>
                    <input type="email" id="email" required placeholder="you@example.com" />
                </div>
                <div class="error" id="errorMsg"></div>
                <button type="submit" class="btn-primary" style="margin-top: 10px;">Request Hardware Token</button>
            </form>
            <div class="links">
                <a href="/auth/login">&larr; Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const errorMsg = document.getElementById('errorMsg');
            const email = document.getElementById('email').value;
            btn.textContent = 'Sending to Display...';
            errorMsg.style.display = 'none';

            try {
                const res = await fetch('/auth/forgot-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: email })
                });
                const data = await res.json();
                if(data.success) {
                    window.location.href = '/auth/verify-reset?email=' + encodeURIComponent(email);
                } else {
                    errorMsg.textContent = data.error || 'Request failed';
                    errorMsg.style.display = 'block';
                    btn.textContent = 'Request Hardware Token';
                }
            } catch(err) {
                errorMsg.textContent = 'Network error';
                errorMsg.style.display = 'block';
                btn.textContent = 'Request Hardware Token';
            }
        });
    </script>
</body>
</html>

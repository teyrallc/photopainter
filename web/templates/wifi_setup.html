<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vignette - WiFi Setup</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 440px;
            width: 100%;
            padding: 28px 24px 16px;
        }
        .brand { text-align: center; margin-bottom: 20px; }
        .brand svg { width: 40px; height: 40px; fill: #0d6efd; }
        .brand h3 { font-size: 22px; margin: 6px 0 2px; }
        .brand p { color: #6c757d; font-size: 13px; }
        label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
        input[type="text"], input[type="password"], select {
            width: 100%; padding: 12px 14px; font-size: 16px;
            border: 2px solid #dee2e6; border-radius: 8px;
            outline: none; transition: border-color 0.2s;
            background: #fff; -webkit-appearance: none;
        }
        input:focus, select:focus { border-color: #0d6efd; }
        .field { margin-bottom: 14px; }
        .pass-wrap { position: relative; }
        .pass-wrap input { padding-right: 48px; }
        .toggle-pass {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            background: none; border: none; font-size: 18px; cursor: pointer;
            color: #6c757d; padding: 4px 8px;
        }
        .btn {
            display: block; width: 100%; padding: 14px; font-size: 16px;
            font-weight: 600; color: #fff; background: #0d6efd;
            border: none; border-radius: 8px; cursor: pointer;
            transition: background 0.2s; margin-top: 8px;
        }
        .btn:hover { background: #0b5ed7; }
        .btn:disabled { background: #6c757d; cursor: wait; }
        .btn-success { background: #198754; }
        .btn-success:hover { background: #157347; }
        .spinner {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff; border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .alert {
            margin-top: 12px; padding: 10px 14px; border-radius: 8px;
            font-size: 13px; text-align: center; line-height: 1.5;
        }
        .alert-info { background: #cff4fc; color: #055160; }
        .alert-warning { background: #fff3cd; color: #664d03; }
        .alert-danger { background: #f8d7da; color: #842029; }
        .footer { text-align: center; color: #6c757d; font-size: 11px; margin-top: 14px; }
        .hidden { display: none !important; }
        .manual-toggle { font-size: 12px; color: #0d6efd; text-decoration: none; cursor: pointer; }
        .manual-toggle:hover { text-decoration: underline; }
        .toggle-row { text-align: right; margin-top: 4px; }
        .countdown-view { text-align: center; }
        .countdown-view h4 { margin-bottom: 8px; }
        .countdown-view .timer {
            font-size: 48px; font-weight: 700; color: #0d6efd;
            margin: 12px 0;
        }
        .countdown-view p { color: #333; font-size: 14px; margin-bottom: 6px; }
        .countdown-view .sub { color: #6c757d; font-size: 12px; line-height: 1.6; }
        .progress-bar {
            width: 100%; height: 6px; background: #e9ecef; border-radius: 3px;
            margin: 16px 0; overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%; background: #0d6efd; border-radius: 3px;
            transition: width 1s linear;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <svg viewBox="0 0 24 24"><path d="M21 2H3a1 1 0 00-1 1v14a1 1 0 001 1h7v2H7v2h10v-2h-3v-2h7a1 1 0 001-1V3a1 1 0 00-1-1zm-1 14H4V4h16v12z"/></svg>
            <h3>Vignette</h3>
            <p>Connect your display to WiFi</p>
        </div>

        <!-- Phase 1: WiFi form -->
        <div id="wifi-form">
            <div class="field">
                <label>WiFi Network</label>
                <select id="ssid-select" onchange="onSelectSSID()">
                    <option value="">-- Loading networks... --</option>
                </select>
                <div id="ssid-manual-row" class="hidden" style="margin-top:8px;">
                    <input type="text" id="ssid-manual" placeholder="Enter WiFi name" autocomplete="off">
                </div>
                <div class="toggle-row">
                    <a class="manual-toggle" onclick="toggleManual();" id="toggle-link">Enter manually</a>
                </div>
            </div>
            <div class="field">
                <label>Password</label>
                <div class="pass-wrap">
                    <input type="password" id="password" placeholder="WiFi password">
                    <button class="toggle-pass" onclick="togglePass()" type="button">&#128065;</button>
                </div>
            </div>
            <button class="btn" onclick="connectWifi()" id="connect-btn">Connect</button>
            <div id="status" class="hidden"></div>
        </div>

        <!-- Phase 2: Countdown & auto-redirect -->
        <div id="countdown-view" class="countdown-view hidden">
            <h4>Connecting to WiFi...</h4>
            <p>Attempting to connect to <strong id="target-ssid"></strong></p>
            <div class="progress-bar"><div class="fill" id="progress-fill" style="width:0%"></div></div>
            <div class="timer" id="countdown-num">20</div>
            <p class="sub">
                Redirecting to the Vignette dashboard automatically.<br>
                If it fails, the hotspot will restart for reconfiguration.
            </p>
            <div id="countdown-status" class="alert alert-info" style="margin-top:12px;">
                Waiting for WiFi connection...
            </div>
        </div>

        <div class="footer">&copy; 2026 Teyra LLC W.Weng</div>
    </div>

    <script>
    var manualMode = false;
    var countdownTimer = null;
    var savedSSID = '';

    function togglePass() {
        var inp = document.getElementById('password');
        inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    function toggleManual() {
        manualMode = !manualMode;
        document.getElementById('ssid-manual-row').classList.toggle('hidden', !manualMode);
        document.getElementById('ssid-select').classList.toggle('hidden', manualMode);
        document.getElementById('toggle-link').textContent = manualMode ? 'Select from list' : 'Enter manually';
    }

    function onSelectSSID() {}

    function getSSID() {
        if (manualMode) return document.getElementById('ssid-manual').value.trim();
        return document.getElementById('ssid-select').value;
    }

    function loadNetworks() {
        var sel = document.getElementById('ssid-select');
        fetch('/api/wifi/scan')
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.networks && d.networks.length) {
                sel.innerHTML = '<option value="">-- Select WiFi network --</option>';
                d.networks.forEach(function(n) {
                    var opt = document.createElement('option');
                    opt.value = n.ssid;
                    opt.textContent = n.ssid + ' (' + n.signal + ')';
                    sel.appendChild(opt);
                });
            } else {
                sel.innerHTML = '<option value="">-- No networks found --</option>';
                toggleManual();
            }
        })
        .catch(function() {
            sel.innerHTML = '<option value="">-- Could not load --</option>';
            toggleManual();
        });
    }

    function connectWifi() {
        var ssid = getSSID();
        var password = document.getElementById('password').value;
        if (!ssid) { showStatus('Please select or enter a WiFi network.', 'warning'); return; }
        savedSSID = ssid;

        // Send connect request (fire-and-forget — we'll lose connection)
        fetch('/api/wifi/connect', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ssid: ssid, password: password})
        }).catch(function() { /* expected: AP drops, connection lost */ });

        // Immediately switch to countdown view
        document.getElementById('wifi-form').classList.add('hidden');
        document.getElementById('countdown-view').classList.remove('hidden');
        document.getElementById('target-ssid').textContent = ssid;

        startCountdown(20);
    }

    function startCountdown(seconds) {
        var remaining = seconds;
        var numEl = document.getElementById('countdown-num');
        var fillEl = document.getElementById('progress-fill');
        var statusEl = document.getElementById('countdown-status');

        numEl.textContent = remaining;
        fillEl.style.width = '0%';

        countdownTimer = setInterval(function() {
            remaining--;
            numEl.textContent = remaining;
            fillEl.style.width = ((seconds - remaining) / seconds * 100) + '%';

            if (remaining <= 10) {
                statusEl.className = 'alert alert-info';
                statusEl.innerHTML = 'Attempting to reach Vignette dashboard...';
            }

            if (remaining <= 0) {
                clearInterval(countdownTimer);
                fillEl.style.width = '100%';
                statusEl.innerHTML = 'Checking connection...';
                tryRedirectToDashboard();
            }
        }, 1000);
    }

    function tryRedirectToDashboard() {
        var statusEl = document.getElementById('countdown-status');
        // Try to reach the root page — if WiFi connected and setup_complete,
        // it should return the dashboard (not this setup page)
        fetch('/', {redirect: 'follow'})
        .then(function(r) { return r.text(); })
        .then(function(html) {
            // If the response contains the dashboard (index.html), redirect
            if (html.indexOf('wifi-form') === -1 && html.indexOf('WiFi Setup') === -1) {
                statusEl.className = 'alert alert-info';
                statusEl.innerHTML = 'Connection successful! Redirecting...';
                setTimeout(function() { window.location.href = '/'; }, 1000);
            } else {
                // Still showing setup page — connection failed, AP restarted
                showFailure();
            }
        })
        .catch(function() {
            // Can't reach server at all — try the new IP from e-paper
            statusEl.className = 'alert alert-warning';
            statusEl.innerHTML =
                'Cannot reach device on this network.<br>' +
                'If WiFi connected, check the e-paper for the new IP address.<br>' +
                'Connect your phone to <strong>' + savedSSID + '</strong> WiFi and open that IP.';
            // Wait and try once more after phone reconnects to AP (if it failed)
            setTimeout(function() {
                fetch('/')
                .then(function(r) { return r.text(); })
                .then(function(html) {
                    if (html.indexOf('wifi-form') !== -1 || html.indexOf('WiFi Setup') !== -1) {
                        showFailure();
                    }
                })
                .catch(function() { /* still unreachable — user checks e-paper */ });
            }, 8000);
        });
    }

    function showFailure() {
        var statusEl = document.getElementById('countdown-status');
        statusEl.className = 'alert alert-danger';
        statusEl.innerHTML =
            'WiFi connection failed. The hotspot has restarted.<br>' +
            'Please check your password and try again.';
        // Show form again after a moment
        setTimeout(function() {
            document.getElementById('countdown-view').classList.add('hidden');
            document.getElementById('wifi-form').classList.remove('hidden');
            showStatus('Connection failed. Please try again.', 'danger');
            loadNetworks();
        }, 3000);
    }

    function showStatus(msg, type) {
        var el = document.getElementById('status');
        el.classList.remove('hidden');
        el.className = 'alert alert-' + type;
        el.innerHTML = msg;
    }

    document.getElementById('password').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') connectWifi();
    });

    loadNetworks();
    </script>
</body>
</html>

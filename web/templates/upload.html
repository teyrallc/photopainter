{% extends "base.html" %}
{% block title %}Vignette - 上傳圖片{% endblock %}

{% block content %}
<h2 class="mb-4"><i class="bi bi-upload"></i> 上傳圖片</h2>

<div class="row g-4">
    <!-- Upload Area -->
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">選擇圖片</div>
            <div class="card-body">
                <div id="drop-zone" class="drop-zone text-center p-5 border border-2 border-dashed rounded">
                    <i class="bi bi-cloud-upload display-4 text-muted"></i>
                    <p class="mt-2 text-muted">拖曳圖片到這裡，或點擊選擇檔案</p>
                    <p class="small text-muted">支援格式：PNG, JPG, JPEG, BMP, GIF</p>
                    <input type="file" id="file-input" accept="image/*" class="d-none">
                </div>

                <div id="upload-progress" class="mt-3 d-none">
                    <div class="progress">
                        <div class="progress-bar progress-bar-striped progress-bar-animated"
                             role="progressbar" style="width: 100%">上傳中...</div>
                    </div>
                </div>

                <div id="upload-result" class="mt-3 d-none">
                    <div class="alert" role="alert"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Preview Area -->
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">預覽</div>
            <div class="card-body">
                <div id="preview-container" class="text-center">
                    <p class="text-muted">上傳圖片後將在此顯示預覽</p>
                </div>

                <div id="preview-actions" class="d-none mt-3">
                    <h6>原始圖片：</h6>
                    <div class="epaper-frame mb-3">
                        <img id="preview-original" class="img-fluid" alt="Original">
                    </div>

                    <h6>電子紙效果預覽 (7色)：</h6>
                    <div class="epaper-frame mb-3">
                        <img id="preview-quantized" class="img-fluid" alt="E-paper preview">
                    </div>

                    <div class="d-grid gap-2">
                        <button id="btn-display" class="btn btn-primary" onclick="displayUploadedImage()">
                            <i class="bi bi-display"></i> 顯示到電子紙
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
let uploadedFilename = null;

dropZone.addEventListener('click', () => fileInput.click());

dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('drag-over');
});

dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('drag-over');
});

dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    if (e.dataTransfer.files.length) {
        uploadFile(e.dataTransfer.files[0]);
    }
});

fileInput.addEventListener('change', () => {
    if (fileInput.files.length) {
        uploadFile(fileInput.files[0]);
    }
});

function uploadFile(file) {
    const formData = new FormData();
    formData.append('file', file);

    document.getElementById('upload-progress').classList.remove('d-none');
    document.getElementById('upload-result').classList.add('d-none');

    fetch('/api/upload', { method: 'POST', body: formData })
        .then(r => r.json())
        .then(data => {
            document.getElementById('upload-progress').classList.add('d-none');
            const resultDiv = document.getElementById('upload-result');
            const alertDiv = resultDiv.querySelector('.alert');
            resultDiv.classList.remove('d-none');

            if (data.success) {
                alertDiv.className = 'alert alert-success';
                alertDiv.textContent = data.message;
                uploadedFilename = data.filename;
                showPreview(data.filename);
            } else {
                alertDiv.className = 'alert alert-danger';
                alertDiv.textContent = data.error;
            }
        })
        .catch(err => {
            document.getElementById('upload-progress').classList.add('d-none');
            showToast('Upload failed: ' + err, 'danger');
        });
}

function showPreview(filename) {
    document.getElementById('preview-container').classList.add('d-none');
    document.getElementById('preview-actions').classList.remove('d-none');
    document.getElementById('preview-original').src = '/output/' + filename;
    document.getElementById('preview-quantized').src = '/api/preview/' + filename;
}

function displayUploadedImage() {
    if (uploadedFilename) {
        displayImage(uploadedFilename);
    }
}
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vignette - WiFi Setup</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 420px;
            width: 100%;
            padding: 28px 24px 16px;
        }
        .brand { text-align: center; margin-bottom: 20px; }
        .brand svg { width: 44px; height: 44px; fill: #0d6efd; }
        .brand h3 { font-size: 22px; margin: 6px 0 2px; }
        .brand p { color: #6c757d; font-size: 13px; }
        label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
        input[type="text"], input[type="password"], select {
            width: 100%; padding: 12px 14px; font-size: 16px;
            border: 2px solid #dee2e6; border-radius: 8px;
            outline: none; transition: border-color 0.2s;
            background: #fff;
        }
        input:focus, select:focus { border-color: #0d6efd; }
        .field { margin-bottom: 14px; }
        .pass-wrap { position: relative; }
        .pass-wrap input { padding-right: 48px; }
        .toggle-pass {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            background: none; border: none; font-size: 18px; cursor: pointer;
            color: #6c757d; padding: 4px 8px;
        }
        .ssid-row { display: flex; gap: 8px; }
        .ssid-row input { flex: 1; }
        .ssid-row select { flex: 1; }
        .btn-scan {
            padding: 12px 14px; font-size: 14px; font-weight: 600;
            color: #fff; background: #6c757d; border: none;
            border-radius: 8px; cursor: pointer; white-space: nowrap;
        }
        .btn-scan:hover { background: #5c636a; }
        .btn {
            display: block; width: 100%; padding: 14px; font-size: 16px;
            font-weight: 600; color: #fff; background: #0d6efd;
            border: none; border-radius: 8px; cursor: pointer;
            transition: background 0.2s; margin-top: 8px;
        }
        .btn:hover { background: #0b5ed7; }
        .btn:disabled { background: #6c757d; cursor: wait; }
        .btn-success { background: #198754; }
        .btn-success:hover { background: #157347; }
        .spinner {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff; border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .alert {
            margin-top: 12px; padding: 10px 14px; border-radius: 8px;
            font-size: 13px; text-align: center; line-height: 1.5;
        }
        .alert-info { background: #cff4fc; color: #055160; }
        .alert-warning { background: #fff3cd; color: #664d03; }
        .alert-danger { background: #f8d7da; color: #842029; }
        .success-icon {
            width: 56px; height: 56px; margin: 0 auto 12px;
            background: #d1e7dd; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: #198754;
        }
        .success-view { text-align: center; }
        .success-view h4 { color: #198754; margin-bottom: 6px; }
        .success-view p { color: #333; margin-bottom: 4px; font-size: 14px; }
        .success-view .ip { color: #0d6efd; font-size: 20px; font-weight: 700; }
        .success-view .hint { color: #6c757d; font-size: 12px; margin: 10px 0 14px; line-height: 1.6; }
        .footer { text-align: center; color: #6c757d; font-size: 11px; margin-top: 14px; }
        .hidden { display: none !important; }
        .or-manual { text-align: center; color: #6c757d; font-size: 12px; margin: 6px 0; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <svg viewBox="0 0 24 24"><path d="M21 2H3a1 1 0 00-1 1v14a1 1 0 001 1h7v2H7v2h10v-2h-3v-2h7a1 1 0 001-1V3a1 1 0 00-1-1zm-1 14H4V4h16v12z"/></svg>
            <h3>Vignette</h3>
            <p>Connect to WiFi to get started</p>
        </div>

        <div id="wifi-form">
            <div class="field">
                <label>WiFi Network</label>
                <select id="ssid-select" onchange="onSelectSSID()">
                    <option value="">-- Scanning... --</option>
                </select>
                <div id="ssid-manual-row" class="hidden" style="margin-top:8px;">
                    <input type="text" id="ssid" placeholder="Enter WiFi name manually" autocomplete="off">
                </div>
                <div class="or-manual">
                    <a href="#" onclick="toggleManualSSID(); return false;" id="toggle-manual-link">Enter manually</a>
                </div>
            </div>
            <div class="field">
                <label>Password</label>
                <div class="pass-wrap">
                    <input type="password" id="password" placeholder="WiFi password">
                    <button class="toggle-pass" onclick="togglePass()" type="button">&#128065;</button>
                </div>
            </div>
            <button class="btn" onclick="connectWifi()" id="connect-btn">Connect</button>
            <div id="status" class="hidden"></div>
        </div>

        <div id="success-view" class="success-view hidden">
            <div class="success-icon">&#10003;</div>
            <h4>Connected!</h4>
            <p>WiFi connected successfully.</p>
            <p><strong>New IP:</strong> <span id="new-ip" class="ip"></span></p>
            <p class="hint">
                The hotspot is now closed.<br>
                Connect your phone to the same WiFi,<br>
                then open the address below:
            </p>
            <a id="go-link" href="#" class="btn btn-success">Open Vignette</a>
        </div>

        <div class="footer">&copy; 2026 Teyra LLC W.Weng</div>
    </div>

    <script>
    var manualMode = false;

    function togglePass() {
        var inp = document.getElementById('password');
        inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    function toggleManualSSID() {
        manualMode = !manualMode;
        document.getElementById('ssid-manual-row').classList.toggle('hidden', !manualMode);
        document.getElementById('ssid-select').classList.toggle('hidden', manualMode);
        document.getElementById('toggle-manual-link').textContent =
            manualMode ? 'Select from list' : 'Enter manually';
    }

    function onSelectSSID() {
        // If user selected a network, use it
    }

    function getSSID() {
        if (manualMode) {
            return document.getElementById('ssid').value.trim();
        }
        return document.getElementById('ssid-select').value;
    }

    function scanNetworks() {
        var sel = document.getElementById('ssid-select');
        sel.innerHTML = '<option value="">-- Scanning... --</option>';
        fetch('/api/wifi/scan').then(function(r) { return r.json(); }).then(function(d) {
            sel.innerHTML = '<option value="">-- Select WiFi --</option>';
            if (d.networks && d.networks.length) {
                d.networks.forEach(function(n) {
                    var opt = document.createElement('option');
                    opt.value = n.ssid;
                    opt.textContent = n.ssid + ' (' + n.signal + ')';
                    sel.appendChild(opt);
                });
            } else {
                sel.innerHTML = '<option value="">-- No networks found --</option>';
            }
        }).catch(function() {
            sel.innerHTML = '<option value="">-- Scan failed --</option>';
        });
    }

    function connectWifi() {
        var ssid = getSSID();
        var password = document.getElementById('password').value;
        if (!ssid) { showStatus('Please select or enter a WiFi network.', 'warning'); return; }

        var btn = document.getElementById('connect-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>Connecting...';
        showStatus('Connecting to WiFi...<br>This may take 15-30 seconds.<br>You may briefly lose connection.', 'info');

        fetch('/api/wifi/connect', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ssid: ssid, password: password})
        })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            btn.disabled = false;
            btn.innerHTML = 'Connect';
            if (d.success) {
                document.getElementById('wifi-form').classList.add('hidden');
                document.getElementById('status').classList.add('hidden');
                document.getElementById('success-view').classList.remove('hidden');
                var ip = d.ip || '...';
                document.getElementById('new-ip').textContent = ip;
                var url = 'http://' + ip + ':5000';
                document.getElementById('go-link').href = url;
                document.getElementById('go-link').textContent = url;
            } else {
                showStatus(d.error || 'Connection failed. Check SSID and password.', 'danger');
            }
        })
        .catch(function() {
            btn.disabled = false;
            btn.innerHTML = 'Connect';
            showStatus('Lost connection to device. If WiFi connected successfully, the e-paper display will show your new IP. Otherwise reconnect to Vignette-Setup and try again.', 'warning');
        });
    }

    function showStatus(msg, type) {
        var el = document.getElementById('status');
        el.classList.remove('hidden');
        el.className = 'alert alert-' + type;
        el.innerHTML = msg;
    }

    document.getElementById('password').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') connectWifi();
    });

    // Auto-scan networks on page load
    scanNetworks();
    </script>
</body>
</html>

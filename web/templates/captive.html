<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vignette - WiFi Setup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .setup-card {
            max-width: 400px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .brand-icon {
            font-size: 3rem;
            color: #0d6efd;
        }
    </style>
</head>
<body>
    <div class="setup-card card">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-display brand-icon"></i>
                <h3 class="mt-2 mb-1">Vignette</h3>
                <p class="text-muted small">Connect to WiFi to get started</p>
            </div>

            <div id="wifi-form">
                <div class="mb-3">
                    <label class="form-label fw-bold">
                        <i class="bi bi-wifi"></i> WiFi Network Name
                    </label>
                    <input type="text" class="form-control form-control-lg" id="ssid"
                           placeholder="Enter WiFi SSID" autocomplete="off" autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">
                        <i class="bi bi-lock"></i> Password
                    </label>
                    <div class="input-group">
                        <input type="password" class="form-control form-control-lg" id="password"
                               placeholder="Enter WiFi password">
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePass()">
                            <i class="bi bi-eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="d-grid">
                    <button class="btn btn-primary btn-lg" onclick="connectWifi()" id="connect-btn">
                        <i class="bi bi-wifi"></i> Connect
                    </button>
                </div>

                <div id="status" class="mt-3 text-center" style="display:none;"></div>
            </div>

            <div id="success-view" style="display:none;" class="text-center">
                <div class="mb-3">
                    <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                </div>
                <h4 class="text-success">Connected!</h4>
                <p class="mb-1">WiFi connected successfully.</p>
                <p class="mb-3">
                    <strong>New IP:</strong> <span id="new-ip" class="text-primary"></span>
                </p>
                <p class="text-muted small mb-3">
                    The hotspot is now closed.<br>
                    Connect your phone to the same WiFi network,<br>
                    then open the address below:
                </p>
                <div class="d-grid">
                    <a id="go-link" href="#" class="btn btn-success btn-lg">
                        <i class="bi bi-box-arrow-up-right"></i> Open Vignette
                    </a>
                </div>
            </div>
        </div>
        <div class="card-footer text-center text-muted small border-0 bg-transparent pb-3">
            &copy; 2026 Teyra LLC W.Weng
        </div>
    </div>

    <script>
    function togglePass() {
        const inp = document.getElementById('password');
        const icon = document.getElementById('eye-icon');
        if (inp.type === 'password') {
            inp.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            inp.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }

    function connectWifi() {
        const ssid = document.getElementById('ssid').value.trim();
        const password = document.getElementById('password').value;
        if (!ssid) {
            showStatus('Please enter WiFi network name.', 'warning');
            return;
        }

        const btn = document.getElementById('connect-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Connecting...';
        showStatus('Connecting to WiFi... This may take 15-30 seconds.<br><small>You may briefly lose connection.</small>', 'info');

        fetch('/api/wifi/connect', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ssid: ssid, password: password})
        })
        .then(r => r.json())
        .then(d => {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-wifi"></i> Connect';
            if (d.success) {
                document.getElementById('wifi-form').style.display = 'none';
                document.getElementById('status').style.display = 'none';
                document.getElementById('success-view').style.display = 'block';
                const ip = d.ip || '...';
                document.getElementById('new-ip').textContent = ip;
                const url = 'http://' + ip + ':5000';
                document.getElementById('go-link').href = url;
                document.getElementById('go-link').textContent = url;
            } else {
                showStatus(d.error || 'Connection failed. Check SSID and password.', 'danger');
            }
        })
        .catch(e => {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-wifi"></i> Connect';
            showStatus('Lost connection to hotspot. If WiFi connected, check the e-paper display for the new IP. Otherwise, reconnect to Vignette-Setup and try again.', 'warning');
        });
    }

    function showStatus(msg, type) {
        const el = document.getElementById('status');
        el.style.display = 'block';
        el.className = 'mt-3 text-center alert alert-' + type;
        el.innerHTML = msg;
    }

    // Allow Enter key to submit
    document.getElementById('password').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') connectWifi();
    });
    document.getElementById('ssid').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('password').focus();
    });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vignette - WiFi Setup</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
            padding: 32px 24px 16px;
        }
        .brand { text-align: center; margin-bottom: 24px; }
        .brand svg { width: 48px; height: 48px; fill: #0d6efd; }
        .brand h3 { font-size: 24px; margin: 8px 0 4px; }
        .brand p { color: #6c757d; font-size: 14px; }
        label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 12px 14px; font-size: 16px;
            border: 2px solid #dee2e6; border-radius: 8px;
            outline: none; transition: border-color 0.2s;
        }
        input:focus { border-color: #0d6efd; }
        .field { margin-bottom: 16px; }
        .pass-wrap { position: relative; }
        .pass-wrap input { padding-right: 48px; }
        .toggle-pass {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            background: none; border: none; font-size: 18px; cursor: pointer;
            color: #6c757d; padding: 4px 8px;
        }
        .btn {
            display: block; width: 100%; padding: 14px; font-size: 16px;
            font-weight: 600; color: #fff; background: #0d6efd;
            border: none; border-radius: 8px; cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #0b5ed7; }
        .btn:disabled { background: #6c757d; cursor: wait; }
        .btn-success { background: #198754; }
        .btn-success:hover { background: #157347; }
        .spinner {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff; border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .alert {
            margin-top: 16px; padding: 12px 16px; border-radius: 8px;
            font-size: 14px; text-align: center; line-height: 1.5;
        }
        .alert-info { background: #cff4fc; color: #055160; }
        .alert-warning { background: #fff3cd; color: #664d03; }
        .alert-danger { background: #f8d7da; color: #842029; }
        .success-icon {
            width: 64px; height: 64px; margin: 0 auto 16px;
            background: #d1e7dd; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; color: #198754;
        }
        .success-view { text-align: center; }
        .success-view h4 { color: #198754; margin-bottom: 8px; }
        .success-view p { color: #333; margin-bottom: 4px; font-size: 14px; }
        .success-view .ip { color: #0d6efd; font-size: 18px; font-weight: 600; }
        .success-view .hint { color: #6c757d; font-size: 13px; margin: 12px 0 16px; line-height: 1.6; }
        .footer { text-align: center; color: #6c757d; font-size: 12px; margin-top: 16px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <svg viewBox="0 0 24 24"><path d="M21 2H3a1 1 0 00-1 1v14a1 1 0 001 1h7v2H7v2h10v-2h-3v-2h7a1 1 0 001-1V3a1 1 0 00-1-1zm-1 14H4V4h16v12z"/></svg>
            <h3>Vignette</h3>
            <p>Connect to WiFi to get started</p>
        </div>

        <div id="wifi-form">
            <div class="field">
                <label>WiFi Network Name</label>
                <input type="text" id="ssid" placeholder="Enter WiFi SSID" autocomplete="off" autofocus>
            </div>
            <div class="field">
                <label>Password</label>
                <div class="pass-wrap">
                    <input type="password" id="password" placeholder="Enter WiFi password">
                    <button class="toggle-pass" onclick="togglePass()" type="button">&#128065;</button>
                </div>
            </div>
            <button class="btn" onclick="connectWifi()" id="connect-btn">Connect</button>
            <div id="status" class="hidden"></div>
        </div>

        <div id="success-view" class="success-view hidden">
            <div class="success-icon">&#10003;</div>
            <h4>Connected!</h4>
            <p>WiFi connected successfully.</p>
            <p><strong>New IP:</strong> <span id="new-ip" class="ip"></span></p>
            <p class="hint">
                The hotspot is now closed.<br>
                Connect your phone to the same WiFi,<br>
                then open the address below:
            </p>
            <a id="go-link" href="#" class="btn btn-success">Open Vignette</a>
        </div>

        <div class="footer">&copy; 2026 Teyra LLC W.Weng</div>
    </div>

    <script>
    function togglePass() {
        var inp = document.getElementById('password');
        inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    function connectWifi() {
        var ssid = document.getElementById('ssid').value.trim();
        var password = document.getElementById('password').value;
        if (!ssid) { showStatus('Please enter WiFi network name.', 'warning'); return; }

        var btn = document.getElementById('connect-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>Connecting...';
        showStatus('Connecting to WiFi...<br>This may take 15-30 seconds.<br>You may briefly lose connection.', 'info');

        fetch('/api/wifi/connect', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ssid: ssid, password: password})
        })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            btn.disabled = false;
            btn.innerHTML = 'Connect';
            if (d.success) {
                document.getElementById('wifi-form').classList.add('hidden');
                document.getElementById('status').classList.add('hidden');
                document.getElementById('success-view').classList.remove('hidden');
                var ip = d.ip || '...';
                document.getElementById('new-ip').textContent = ip;
                var url = 'http://' + ip + ':5000';
                document.getElementById('go-link').href = url;
                document.getElementById('go-link').textContent = url;
            } else {
                showStatus(d.error || 'Connection failed. Check SSID and password.', 'danger');
            }
        })
        .catch(function() {
            btn.disabled = false;
            btn.innerHTML = 'Connect';
            showStatus('Lost connection. The display will show the new IP if WiFi connected. Otherwise, reconnect to Vignette-Setup and try again.', 'warning');
        });
    }

    function showStatus(msg, type) {
        var el = document.getElementById('status');
        el.classList.remove('hidden');
        el.className = 'alert alert-' + type;
        el.innerHTML = msg;
    }

    document.getElementById('password').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') connectWifi();
    });
    document.getElementById('ssid').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('password').focus();
    });
    </script>
</body>
</html>

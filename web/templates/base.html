<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vignette{% endblock %}</title>
    <!-- Vendored locally so the LAN photo frame works with no internet. -->
    <link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-display"></i> Vignette
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                            <i class="bi bi-house"></i> {{ t.dashboard }}
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/upload' %}active{% endif %}" href="/upload">
                            <i class="bi bi-upload"></i> {{ t.upload }}
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/gallery' %}active{% endif %}" href="/gallery">
                            <i class="bi bi-images"></i> {{ t.gallery }}
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/settings' %}active{% endif %}" href="/settings">
                            <i class="bi bi-gear"></i> {{ t.settings }}
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/manual' %}active{% endif %}" href="/manual">
                            <i class="bi bi-book"></i> {{ t.manual }}
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <button class="btn btn-sm btn-outline-light me-2" onclick="toggleLang()" id="lang-toggle">
                            {{ 'EN' if current_lang == 'zh' else '中文' }}
                        </button>
                    </li>
                    {% if session.get('logged_in') %}
                    <li class="nav-item">
                        <!-- POST so a cross-site GET/img can't silently log you out. -->
                        <form action="/auth/logout" method="post" class="d-inline m-0">
                            <button type="submit" class="nav-link text-danger btn btn-link"
                                    style="text-decoration:none;">
                                <i class="bi bi-box-arrow-right"></i> {{ t.logout or 'Logout' }}
                            </button>
                        </form>
                    </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4 mb-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-dark text-light text-center py-3 mt-auto">
        <img src="{{ url_for('static', filename='img/vignette-logo.svg') }}"
             alt="Vignette"
             style="height:36px; filter: brightness(0) invert(1); opacity:0.85; display:block; margin:0 auto 6px;">
        <small>&copy; 2026 Teyra LLC W.Weng</small>
    </footer>

    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
    <script>
    // tojson emits a properly-escaped JS string (handles quotes/apostrophes and
    // is safe inside <script>), unlike a bare "{{ t.x }}" which HTML-escapes
    // apostrophes to &#39; and breaks on embedded quotes.
    window.VIGNETTE_I18N = {
        sending_to_epaper: {{ t.sending_to_epaper | tojson }},
        displayed_ok: {{ t.displayed_ok | tojson }},
        confirm_clear: {{ t.confirm_clear | tojson }},
        clearing: {{ t.clearing | tojson }},
        sleep_ok: {{ t.sleep_ok | tojson }},
        loading_next: {{ t.loading_next | tojson }},
        loading_prev: {{ t.loading_prev | tojson }},
        loading_latest: {{ t.loading_latest | tojson }},
        confirm_test: {{ t.confirm_test | tojson }},
        sending_test: {{ t.sending_test | tojson }}
    };
    </script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
    function toggleLang() {
        const current = '{{ current_lang }}';
        const newLang = current === 'en' ? 'zh' : 'en';
        fetch('/api/lang', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({lang: newLang})
        }).then(r => r.json()).then(d => {
            if (d.success) location.reload();
        });
    }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
